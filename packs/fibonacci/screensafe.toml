width = 0
fill = "mix(background, brown, 0.35)"

# Each seed turned from the last by the golden angle, 137.5 degrees.
[[scene.draw]]
kind = "rect"
count = 1000
x = "0.43 * sqrt((i + 0.5) / n) * cos(i * 2.39996)"
y = "0.43 * sqrt((i + 0.5) / n) * sin(i * 2.39996)"
w = "0.007 + 0.006 * sqrt(k)"
h = "0.007 + 0.006 * sqrt(k)"
rotate = "i * 2.39996"
visible = "i < (t - 1.5) * 90"
color = "t < 12 ? mix(brown, foreground, 0.25 + 0.3 * k) : t < 20.5 ? pick(mod(i, 21), accent, mix(brown, foreground, 0.2)) : pick(mod(i, 34), cyan, mix(brown, foreground, 0.2))"

