[[scene]]
name = "The sunflower"
duration = 30
fade = 1.2

# Petals, opening.
[[scene.draw]]
kind = "lines"
count = 21
samples = 20
closed = true
width = 0
let = ["ang = (i + 0.0) * tau / n + 0.1 * t / 30", "open = ease_out((t - 0.6 - hash(i * 3.7) * 1.5) / 3)", "len = 0.2 * open * (0.9 + 0.2 * hash(i * 5.1))"]
sample_let = ["along = 0.42 + len * 0.5 * (1 - cos(s * tau))", "across = len * 0.16 * sin(s * tau)"]
px = "along * cos(ang) - across * sin(ang)"
py = "along * sin(ang) + across * cos(ang)"
fill = "alpha(orange, 0.85)"

[[scene.draw]]
kind = "lines"
count = 34
samples = 20
closed = true
width = 0
let = ["ang = (i + 0.5) * tau / n + 0.1 * t / 30", "open = ease_out((t - 1.1 - hash(i * 3.7) * 1.5) / 3)", "len = 0.17 * open * (0.9 + 0.2 * hash(i * 5.1))"]
