# Clockwork: original open mechanical movement. Generated by tools/clockwork/build.py.
format = 2
name = "Clockwork"
author = "ScreenSafe"
license = "MIT"
description = "A slow camera journey through an open mechanical movement: interlocking gears, jeweled bearings and a breathing balance spring."
stage = "screen"
fps = 20
fade = 0
preview = 8
colorize = "tint_color"
background = "#10171b"

[[setting]]
name = "camera"
label = "Camera"
kind = "choice"
choices = ["Journey", "Overview", "Close-up"]
values = [1, 0, 2]
default = 1

[[setting]]
name = "finish"
label = "Finish"
kind = "choice"
choices = ["Brass", "Steel", "Theme"]
values = [0, 1, 2]
default = 0

[[setting]]
name = "pace"
label = "Pace"
kind = "choice"
choices = ["Slow", "Normal", "Lively"]
values = [0.5, 1, 1.5]
default = 1

[[setting]]
name = "detail"
label = "Detail"
kind = "choice"
choices = ["Simple", "Engraved"]
values = [0, 1]
default = 1

[[setting]]
name = "tint_color"
label = "Color"
kind = "color"
default = 0
when = "finish"
when_value = 2

[colors]
void = "finish == 2 ? background : #10171b"
plate = "finish == 2 ? mix(background, foreground, 0.08) : pick(finish, #283235, #26333f)"
plate_light = "finish == 2 ? mix(background, foreground, 0.14) : pick(finish, #3b4545, #384b5a)"
plate_edge = "finish == 2 ? mix(background, foreground, 0.28) : #60706e"
metal = "finish == 2 ? mix(accent, foreground, 0.28) : pick(finish, #b99a60, #93aab3)"
metal_dark = "finish == 2 ? mix(background, accent, 0.52) : pick(finish, #756244, #506a79)"
metal_light = "finish == 2 ? mix(accent, foreground, 0.7) : pick(finish, #dfc18a, #d0dde0)"
edge = "finish == 2 ? mix(background, accent, 0.22) : pick(finish, #483d2e, #2c424f)"
silver = "finish == 2 ? mix(accent, foreground, 0.7) : #bacbc9"
steel_dark = "finish == 2 ? mix(background, foreground, 0.22) : #31434a"
jewel = "finish == 2 ? red : #9c4b55"
jewel_light = "finish == 2 ? mix(red, foreground, 0.4) : #db9995"
ink = "finish == 2 ? mix(background, foreground, 0.5) : #7c8c89"

[[scene]]
name = "Inside the movement"
duration = "32 / pace"
background = "void"
let = ["ct = t * pace", "orbit = ct * tau / 32", "dive = (1 - cos(orbit)) * 0.5",
       "lens = (camera == 0 ? 0.92 : camera == 2 ? 2.25 : 0.92 + 1.25 * dive) * min(1, aspect / (16 / 9))",
       "view_x = camera == 0 ? 0 : camera == 2 ? 0.34 + 0.05 * sin(orbit) : 0.40 * dive + 0.09 * sin(orbit)",
       "view_y = camera == 0 ? 0.015 : camera == 2 ? 0.15 + 0.03 * sin(orbit * 2) : 0.16 * dive - 0.04 * sin(orbit)",
       "approach = camera == 0 ? 0.3 : 0.3 + 0.7 * dive", "balance_angle = 0.43 * sin(orbit * 12)"]

[[scene.draw]]
kind = "rect"
count = 20
x = "(i - 9.5) * 0.11"
w = 0.0006
h = 2
color = "alpha(ink, 0.045)"

[[scene.draw]]
kind = "group"
let = ["plane_scale = lens / (1 - 0 * approach)"]
scale = "plane_scale"
x = "-view_x * plane_scale"
y = "-view_y * plane_scale"

