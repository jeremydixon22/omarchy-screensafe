[[scene]]
name = "Assemble"
duration = 32
fade = 1.5

# Tiles flying in, one after another, then raining away.
[[scene.draw]]
kind = "sprite"
file = "shield.png"
source = "badge"
smooth = true
frame_size = [64, 64]
anchor = [32, 32]
count = 64
frame = "i"
let = ["col = mod(i, 8)", "row = floor(i / 8)", "hx = (col - 3.5) * 0.07", "hy = (row - 3.5) * 0.07", "arrive = ease_out(clamp((t - 1 - hash(i * 2.9) * 8) / 2.5, 0, 1))", "fall = ease_in(clamp((t - 22 - hash(i * 4.4) * 6) / 2.2, 0, 1))", "sx = (hash(i * 6.1) * 2 - 1) * aspect * 0.6", "sy = (hash(i * 8.3) * 2 - 1) * 0.6"]
x = "mix(sx, hx, arrive)"
y = "mix(sy, hy, arrive) + fall * 1.2"
visible = "(logo == 0 && !pixelart) && (arrive > 0 && fall < 1)"
pixel = "0.00113"

[[scene.draw]]
kind = "sprite"
file = "shield-pixel.png"
source = "badge"
smooth = false
palette = "theme"
frame_size = [8, 8]
anchor = [4, 4]
count = 64
