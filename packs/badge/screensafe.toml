[[scene]]
name = "Wave"
duration = 32
fade = 1.5

# A wave through the badge, as through a flag.
[[scene.draw]]
kind = "sprite"
file = "shield.png"
source = "badge"
smooth = true
frame_size = [16, 512]
anchor = [8, 256]
count = 32
frame = "i"
let = ["calm = smoothstep(1, 4, t) * (1 - smoothstep(28, 31, t))"]
x = "(i - 15.5) * 0.0175"
y = "0.04 * sin(i * 0.1875 - t * 2.1) * calm"
pixel = "0.00113"
visible = "logo == 0 && !pixelart"

