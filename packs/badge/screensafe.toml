[[scene]]
name = "Orbit"
duration = 32
fade = 1.5

# Six small copies in orbit about a large one.
[[scene.draw]]
kind = "sprite"
file = "shield.png"
source = "badge"
smooth = true
frame_size = [512, 512]
anchor = [256, 256]
count = 6
let = ["a = i / n * tau + t * 0.35"]
visible = "(logo == 0 && !pixelart) && (sin(a) < 0)"
x = "0.62 * cos(a)"
y = "0.3 * sin(a)"
pixel = "0.00024 * (0.85 + 0.15 * sin(a))"

