# Badge: ScreenSafe's shield or the Omarchy mark, or your own badge, bouncing, shattering, waving and in orbit. To show yours, put an image at ~/.config/omarchy/screensafe/badge.png. Written by tools/badge/build.py.
format = 1
name = "Badge"
author = "ScreenSafe"
license = "MIT"
description = "ScreenSafe's shield or the Omarchy mark, or your own badge, bouncing, shattering, waving and in orbit. To show yours, put an image at ~/.config/omarchy/screensafe/badge.png."
preview = 138
fps = 30
fade = 0

[[setting]]
name = "logo"
label = "Picture"
kind = "choice"
choices = ["ScreenSafe", "Omarchy"]
values = [0, 1]
default = 0

[[setting]]
name = "pixelart"
label = "Pixel art in theme colors"
kind = "toggle"
default = false

[[scene]]
name = "Bounce"
duration = 32
fade = 1.5

# The badge, drifting from edge to edge and back.
[[scene.draw]]
kind = "sprite"
file = "shield.png"
source = "badge"
smooth = true
frame_size = [512, 512]
anchor = [256, 256]
x = "(tri(time / 23 + 0.2) - 0.5) * (aspect - 0.31248)"
y = "(tri(time / 17 + 0.6) - 0.5) * 0.6528"
pixel = "0.00068"
visible = "logo == 0 && !pixelart"

[[scene.draw]]
kind = "sprite"
file = "shield-pixel.png"
source = "badge"
smooth = false
palette = "theme"
frame_size = [64, 64]
anchor = [32, 32]
x = "(tri(time / 23 + 0.2) - 0.5) * (aspect - 0.31248)"
y = "(tri(time / 17 + 0.6) - 0.5) * 0.6528"
pixel = "0.00543"
visible = "logo == 0 && pixelart"

[[scene.draw]]
kind = "sprite"
file = "omarchy.png"
source = "badge"
smooth = true
frame_size = [512, 512]
anchor = [256, 256]
x = "(tri(time / 23 + 0.2) - 0.5) * (aspect - 0.31248)"
y = "(tri(time / 17 + 0.6) - 0.5) * 0.6528"
pixel = "0.00068"
visible = "logo == 1 && !pixelart"

[[scene.draw]]
kind = "sprite"
file = "omarchy-pixel.png"
source = "badge"
smooth = false
palette = "theme"
frame_size = [64, 64]
anchor = [32, 32]
x = "(tri(time / 23 + 0.2) - 0.5) * (aspect - 0.31248)"
y = "(tri(time / 17 + 0.6) - 0.5) * 0.6528"
pixel = "0.00543"
visible = "logo == 1 && pixelart"

[[scene]]
name = "Shatter"
duration = 32
fade = 1.5

# Whole, bursting apart, drifting, and snapping back together.
[[scene.draw]]
kind = "sprite"
file = "shield.png"
source = "badge"
smooth = true
frame_size = [64, 64]
anchor = [32, 32]
count = 64
frame = "i"
let = ["col = mod(i, 8)", "row = floor(i / 8)", "hx = (col - 3.5) * 0.07", "hy = (row - 3.5) * 0.07", "burst = ease_out(clamp((t - 3) / 4, 0, 1))", "snap = clamp((t - 19) / 5, 0, 1)", "back = 1 + 2.70158 * (snap - 1) ^ 3 + 1.70158 * sqr(snap - 1)", "out = t < 19 ? burst : 1 - back", "spin = 0.8 * sin(pi * clamp((t - 3) / 21, 0, 1))", "ang = atan2(hy, hx) + out * (hash(i * 3.1) - 0.5) * 1.2 + spin", "dist = sqrt(sqr(hx) + sqr(hy)) * (1 + out * (0.6 + hash(i * 7.3) * 0.9))", "settle = 1 + 0.05 * max(0, 1 - abs(t - 24.2) * 2)"]
x = "dist * cos(ang) * settle"
y = "dist * sin(ang) * settle"
pixel = "0.00113 * (1 - 0.3 * clamp(out, 0, 1) * hash(i * 5.7)) * settle"
visible = "logo == 0 && !pixelart"

[[scene.draw]]
kind = "sprite"
file = "shield-pixel.png"
source = "badge"
smooth = false
palette = "theme"
frame_size = [8, 8]
anchor = [4, 4]
count = 64
frame = "i"
let = ["col = mod(i, 8)", "row = floor(i / 8)", "hx = (col - 3.5) * 0.07", "hy = (row - 3.5) * 0.07", "burst = ease_out(clamp((t - 3) / 4, 0, 1))", "snap = clamp((t - 19) / 5, 0, 1)", "back = 1 + 2.70158 * (snap - 1) ^ 3 + 1.70158 * sqr(snap - 1)", "out = t < 19 ? burst : 1 - back", "spin = 0.8 * sin(pi * clamp((t - 3) / 21, 0, 1))", "ang = atan2(hy, hx) + out * (hash(i * 3.1) - 0.5) * 1.2 + spin", "dist = sqrt(sqr(hx) + sqr(hy)) * (1 + out * (0.6 + hash(i * 7.3) * 0.9))", "settle = 1 + 0.05 * max(0, 1 - abs(t - 24.2) * 2)"]
x = "dist * cos(ang) * settle"
y = "dist * sin(ang) * settle"
pixel = "0.00901 * (1 - 0.3 * clamp(out, 0, 1) * hash(i * 5.7)) * settle"
visible = "logo == 0 && pixelart"

