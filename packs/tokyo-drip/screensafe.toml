glow = 1.2
glow_radius = 0.008
let = ["slot = mod(time, screen == 1 ? 88 : screen == 2 ? 56 : 36)", "pic = screen == 2 && slot >= 40 && slot < 48 ? 4 : min(3, floor(slot / 12))", "blend = slot < 36 ? smoothstep(0.85, 1, fract(slot / 12)) : 0", "cx = 0", "cy = -0.24622"]

[[scene.draw.draw]]
kind = "rect"
count = 576
let = ["c = mod(i, 32)", "r = floor(i / 32)", "cu = c / 31", "cv = r / 17", "wave = 0.5 + 0.5 * sin(cu * 9 - time * 2.2 + sin(cv * 4 + time) * 1.5)", "level = step(1 - cv, 0.15 + 0.8 * noise(c * 0.37 + time * 1.8) ^ 1.5)", "ring = 0.5 + 0.5 * cos(sqrt(sqr((cu - 0.5) * 1.8) + sqr(cv - 0.5)) * 22 - time * 3)", "mc = c - 9", "mr = r - 2", "mrow = pick(clamp(mr, 0, 12), 8191, 4161, 6093, 5125, 5125, 5125, 7173, 5125, 5125, 5125, 6141, 4161, 8159)", "inside = mc >= 0 && mc < 13 && mr >= 0 && mr < 13", "mark = inside ? mod(floor(mrow / 2 ^ (12 - mc)), 2) * step((mc + mr) / 24, (slot - 40) / 2.5) * (0.8 + 0.2 * sin(time * 3)) : 0", "a = pick(pic, wave, level, ring, 0, mark)", "b = pick(pic + 1, wave, level, ring, 0, mark)", "lit = mix(a, b, blend)"]
x = "-0.11194 + c * 0.00722"
y = "-0.30751 + r * 0.00721"
w = "0.0052"
h = "0.00519"
color = "alpha(pick(pic, mix(bright_cyan, bright_magenta, cu), mix(blue, red, 1 - cv), mix(accent, bright_yellow, cv), accent, mix(accent, white, 0.15)), 0.08 + 0.92 * lit)"

