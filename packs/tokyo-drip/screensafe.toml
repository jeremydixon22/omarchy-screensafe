# Drops swelling under every sign, then falling,
[[scene.draw]]
kind = "lines"
count = 10
samples = 2
width = "0.009 / dz"
visible = "rain > 0"
let = ["dx = pick(i, -0.94, -0.96, -0.96, -0.97, -0.97, 0.95, 0.96, 0.96, 0.97, 0.98)", "dy = pick(i, 0.00264, -0.22362, -0.62362, -0.65859, -0.85859, -0.33502, -0.49771, -0.54771, -1.0693, -0.59806)", "dz = pick(i, 1.55, 2.35, 3.4, 4.9, 6.8, 1.75, 2.7, 3.9, 5.5, 7.4)", "period = 1.6 + 1.4 * hash(i * 5.3)", "age = mod(time + hash(i * 8.1) * 9, period)", "fall = sqrt(2 * (0.5 - dy) / 9)", "swell = clamp(age / (period - fall), 0, 1)", "fy = age < period - fall ? dy + 0.02 * swell : dy + 0.02 + 4.5 * sqr(age - period + fall)", "len = age < period - fall ? 0.015 : 0.06"]
px = "dx * 0.8 / dz"
py = "-0.04 + (fy - len * s) * 0.8 / dz"
color = "alpha(mix(pick(i, red, bright_yellow, bright_magenta, blue, bright_cyan, bright_cyan, accent, magenta, red, green), white, 0.5), 0.85)"

# and landing in rings.
[[scene.draw]]
kind = "lines"
count = 20
samples = 20
closed = true
width = 0.0012
let = ["dx = pick(mod(i, 10), -0.94, -0.96, -0.96, -0.97, -0.97, 0.95, 0.96, 0.96, 0.97, 0.98)", "dy = pick(mod(i, 10), 0.00264, -0.22362, -0.62362, -0.65859, -0.85859, -0.33502, -0.49771, -0.54771, -1.0693, -0.59806)", "dz = pick(mod(i, 10), 1.55, 2.35, 3.4, 4.9, 6.8, 1.75, 2.7, 3.9, 5.5, 7.4)", "period = 1.6 + 1.4 * hash(i * 5.3)", "age = mod(time + hash(i * 8.1) * 9, period)", "fall = sqrt(2 * (0.5 - dy) / 9)", "since = age", "ring = floor(i / 10)", "gr = (0.04 + 0.1 * since) * (1 - ring * 0.4)"]
sample_let = ["zz = dz + gr * sin(s * tau)"]
px = "(dx + gr * cos(s * tau)) * 0.8 / zz"
py = "-0.04 + 0.4 / zz"
visible = "rain > 0 && since < 0.9"
color = "alpha(mix(pick(mod(i, 10), red, bright_yellow, bright_magenta, blue, bright_cyan, bright_cyan, accent, magenta, red, green), white, 0.4), 0.6 * (1 - since / 0.9))"

# Rain, falling at many depths.
[[scene.draw]]
