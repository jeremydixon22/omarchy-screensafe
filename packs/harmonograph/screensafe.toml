# A harmonograph: two pendulums swinging at nearly matching rates draw a figure that slowly winds inwards as they
# lose their swing. Each figure draws itself in, glows for a while and fades, and the next uses new rates.
format = 1
name = "Harmonograph"
author = "ScreenSafe"
license = "MIT"
description = "Two pendulums slowly draw a glowing figure that winds inwards; each fades for a new one with different swings."
stage = "16:9"
fps = 30
background = "background"

[params]
# How many swings each figure takes, and how fast the swing dies away.
turns = 24
damping = 0.008

# What can be changed in the panel: how long each figure takes to draw, and whether it glows.
[[setting]]
name = "drawing"
label = "Drawing time"
kind = "choice"
choices = ["Quick", "Normal", "Unhurried"]
values = [16, 26, 40]
default = 26

[[setting]]
name = "glowing"
label = "Glow"
kind = "toggle"
default = true

[[scene]]
name = "Figure"
duration = "drawing"
hold = 6
fade = 2
let = [
  # New rates each time round: a small whole-number ratio, slightly out of tune.
  "seed = cycle * 1.37 + 0.5",
  "pair = rand(seed) * 5",
  "fa = pick(pair, 2, 3, 3, 4, 1)",
  "fb = pick(pair, 3, 2, 4, 3, 2)",
  "da = (rand(seed + 0.4) - 0.5) * 0.02",
  "db = (rand(seed + 0.6) - 0.5) * 0.02",
  "pa = rand(seed + 0.8) * tau",
  "pb = rand(seed + 0.9) * tau",
  # A second, weaker pendulum on each axis, swinging at the other's rate.
  "pc = rand(seed + 0.15) * tau",
  "pd = rand(seed + 0.35) * tau",
  "spin = time * 0.03",
]

[[scene.draw]]
kind = "group"
glow = "glowing ? 1.6 : 0"
glow_radius = 0.006
rotate = "spin"

  # The figure, in six stretches from the accent to magenta, each drawn in as the pen reaches it.
  [[scene.draw.draw]]
  kind = "lines"
  count = 6
  samples = 420
  let = [
    "s0 = k * 5 / 6",
    "pen = ease_in_out(u)",
  ]
  draw = "clamp((pen - i / 6) * 6, 0, 1)"
  px = "0.3 * exp(-damping * (s0 + s / 6) * turns * tau) * (sin(fa * (1 + da) * (s0 + s / 6) * turns * tau + pa) + 0.45 * sin(fb * (1 - db) * (s0 + s / 6) * turns * tau + pc))"
  py = "0.3 * exp(-damping * (s0 + s / 6) * turns * tau) * (sin(fb * (1 + db) * (s0 + s / 6) * turns * tau + pb) + 0.45 * sin(fa * (1 - da) * (s0 + s / 6) * turns * tau + pd))"
  width = 0.0018
  color = "mix(accent, magenta, k)"
  opacity = 0.85
