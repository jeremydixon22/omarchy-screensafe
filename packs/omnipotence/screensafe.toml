# Omnipotence: each figure is drawn over the very lines of this file that draw it, and the Hand of Omnipotence
# turns the page to the next. Written by tools/omnipotence/build.py; the hand is released with the pack under its
# MIT license.
format = 1
name = "Omnipotence"
author = "ScreenSafe"
license = "MIT"
description = "Figures drawn over the very code that draws them, each line lighting up as it works, until the Hand of Omnipotence turns the page."
preview = 36.7
fps = 30
fade = 0
background = "#080B16"

[[scene]]
name = "Page I: The Fern"
duration = 40
fade = 0
let = ["codeop = t < 5 ? 1 : mix(1, 0.3, smoothstep(5, 7, t)) * (1 - smoothstep(34.5, 35.1, t))", "sky = smoothstep(5, 9, t)", "fold = t < 34.5 ? -4 : t >= 39.5 ? 4 : interp(t, 34.5, -1.0358, 35.2, -0.92, 36.4, -0.5, 37.6, 0, 38.5, 0.55, 39.4, 1.2458)", "dm = max(0, fold - -1.0158)", "rr = interp(fold, -1.0358, 0.05, -0.7, 0.15)", "bend = interp(fold, -1.0358, 0.7, -0.8, 2, -0.6, 2.8, -0.4, 2.9, 0, 2.9, 0.3, 2.3, 0.6, 1.9, 1.2458, 1.7)", "near = interp(fold, 0, 0.4, 0.3, 1.2, 0.6, 1.7, 1.2458, 2)", "cq = dm", "ca = min(cq / rr, bend)", "cr = max(0, cq - bend * rr)", "cm = -1.0158 + cq - rr * sin(ca) - cr * cos(bend)", "cz = rr * (1 - cos(ca)) + cr * sin(bend)", "ck = min(3, 1 + near * cz)", "ct = 0.0912", "gl = 1 - smoothstep(34.1, 35.1, t)", "reach = t < 33 ? 1 : 1 - ease_out((t - 33) / 1.5)"]

