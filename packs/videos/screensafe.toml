# Videos: bounded playback surfaces, with illustrated surrounds. Generated by tools/videos/build.py.
format = 2
name = "Videos"
author = "ScreenSafe"
license = "MIT"
description = "Your local videos, full screen or framed as film reels, a CRT or a flatscreen."
stage = "screen"
fps = 24
fade = 0
background = "black"
colorize = "tint_color"

[params]
flat_led = 0.8
flat_logo = 1.35
flat_logo_out = 5.7
flat_input = 6.15
flat_play = 6.8
flat_osd_out = 7.9

[[setting]]
name = "style"
label = "Style"
kind = "choice"
choices = ["Full screen", "Whole", "Film", "CRT Fit", "CRT Box", "Flatscreen"]
values = [0, 1, 2, 5, 3, 4]
default = 0

[[setting]]
name = "loop"
label = "Loop"
kind = "toggle"
default = true

[[setting]]
name = "each"
label = "Each video"
kind = "choice"
choices = ["Full length", "5 s", "10 s", "20 s", "45 s", "90 s"]
values = [0, 5, 10, 20, 45, 90]
default = 0

[[setting]]
name = "order"
label = "Order"
kind = "choice"
choices = ["Shuffle", "In order"]
values = [0, 1]
default = 0

[[setting]]
name = "tone"
label = "Tone"
kind = "choice"
choices = ["Original", "Greyscale", "Sepia", "Theme"]
values = [0, 1, 2, 3]
default = 0

[[setting]]
name = "tint_color"
label = "Color"
kind = "color"
default = 0
when = "tone"
when_value = 3

[[scene]]
name = "Videos"
duration = "each > 0 ? each : video_longest"
let = ["clips = max(videos, 1)", "seed = rand(3) * 997", "crt = style == 3 || style == 5", "play = max(0, time - (crt ? 0.625 : style == 4 ? flat_play : 0))", "lap = floor(play / dur)", "slot = loop ? lap : min(lap, clips - 1)", "pass = floor(slot / clips)", "stride = pick(hash(pass * 3.3 + seed) * 4, 211, 223, 227, 229)", "selected = order == 0 ? mod(mod(slot, clips) * stride + floor(hash(pass * 1.7 + seed) * clips), clips) : mod(slot, clips)", "before = max(0, slot - 1)", "before_pass = floor(before / clips)", "before_stride = pick(hash(before_pass * 3.3 + seed) * 4, 211, 223, 227, 229)", "previous = order == 0 ? mod(mod(before, clips) * before_stride + floor(hash(before_pass * 1.7 + seed) * clips), clips) : mod(before, clips)", "position = loop || lap < clips ? mod(play, dur) : min(video_longest, dur)", "motion = loop || lap < clips ? play : clips * dur", "phase = mod(play, dur)", "switching = crt && slot > 0 && selected != previous && (loop || lap < clips) && phase < 0.32", "signal = switching ? 0.3 + 0.7 * smoothstep(0, 0.32, phase) : 1", "power = smoothstep(0.12, 0.625, time)", "opening = smoothstep(0.16, 0.52, time)", "drift_x = 10 * video_pixel * sin(time * tau / 1020)", "drift_y = 10 * video_pixel * sin(time * tau / 1380)", "projector = 0.94 + 0.04 * sin(motion * 1.7) + 0.02 * sin(motion * 3.9)"]


[[scene.draw]]
kind = "group"
visible = "videos > 0 && style == 0"

[[scene.draw.draw]]
kind = "image"
source = "videos"
index = "selected"
position = "position"
filter = "tone"
fit = "cover"

[[scene.draw]]
kind = "group"
visible = "videos > 0 && style == 1"

[[scene.draw.draw]]
kind = "image"
source = "videos"
index = "selected"
position = "position"
filter = "tone"
fit = "contain"

