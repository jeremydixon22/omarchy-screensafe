clip = ["-0.39", "-0.5", "0.39", "0.5"]

[[scene.draw.draw.draw]]
kind = "group"
count = 4
let = ["cell = i"]
x = "0.001 * sin(motion * 17)"
y = "(1 - i + fract(floor(motion * 24) / 24)) * 0.34"
opacity = "0.98 + 0.007 * hash(floor(motion * 24))"

