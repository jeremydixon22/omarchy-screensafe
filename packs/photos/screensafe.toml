# Prints: a new one dropped onto the pile each time, the newest on top.
[[scene.draw]]
kind = "group"
visible = "style == 2"
sort = true

  [[scene.draw.draw]]
  kind = "group"
  count = 5
  let = ["c = cycle - i", "pass = floor(c / count)", "stride = pick(hash(pass * 3.3 + seed) * 4, 211, 223, 227, 229)", "pk = order == 0 ? mod(mod(c, count) * stride + floor(hash(pass * 1.7 + seed) * count), count) : mod(c, count)", "drop = i == 0 ? ease_out(clamp(t / 0.7, 0, 1)) : 1"]
  visible = "c >= 0 && i < count"
  depth = "-i"
  x = "(hash(c * 3.1) - 0.5) * (aspect - 0.73)"
  y = "(hash(c * 5.7) - 0.5) * 0.43"
  rotate = "(hash(c * 9.2) - 0.5) * 0.45"
  scale = "1 + 0.25 * (1 - drop)"
  opacity = "i == 0 ? clamp(t / 0.3, 0, 1) : 1"

    [[scene.draw.draw.draw]]
    kind = "rect"
    x = 0.012
    y = 0.016
    w = 0.58
    h = 0.42
    color = "alpha(black, 0.4)"

