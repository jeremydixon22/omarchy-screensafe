# Where to put your own, while the examples stand in for them: for the first few seconds, unless turned off.
[[scene.draw]]
kind = "text"
visible = "hint && source == 0 && photos == 0 && time < 3"
opacity = "1 - smoothstep(2.4, 3, time)"
text = "Examples · put your own photos in ~/Pictures/Screensaver"
x = "-aspect / 2 + 0.03"
y = 0.46
size = 0.022
color = "alpha(white, 0.75)"
