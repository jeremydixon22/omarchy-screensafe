name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        working-directory: renderer
        run: rustup show active-toolchain || rustup toolchain install
      - name: Tests
        working-directory: renderer
        run: cargo test --locked
      - name: Lints
        working-directory: renderer
        run: |
          rustup component add clippy rustfmt
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --check
      - name: Built-in packs
        run: for pack in packs/*/; do bin/screensafe-x86_64 check "$pack" --seconds 120 >/dev/null; done
      - name: The committed renderer matches its source
        run: scripts/verify-release

  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        working-directory: renderer
        run: rustup show active-toolchain || rustup toolchain install
      - name: Tests
        working-directory: renderer
        run: cargo test --locked
      - name: Built-in packs, with the committed ARM renderer
        run: for pack in packs/*/; do bin/screensafe-aarch64 check "$pack" --seconds 120 >/dev/null; done
      - name: Confinement
        run: bin/screensafe-aarch64 sandbox-test

  provenance:
    if: github.event_name == 'push'
    needs: [test, arm]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild and compare
        run: scripts/verify-release
      - name: Attest the committed renderer
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/screensafe-x86_64
            bin/screensafe-aarch64
